name: Generate Snake

on:
  # Запуск каждые 12 часов
  schedule:
    - cron: "0 */12 * * *"
  
  # Позволяет запустить генерацию вручную в любой момент
  workflow_dispatch:
  
  # Запуск при каждом пуше в ветку main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Генерация анимации змейки (GIF и SVG для светлой/темной тем)
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?palette=github-dark

      # Пуш созданных файлов в ветку 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
